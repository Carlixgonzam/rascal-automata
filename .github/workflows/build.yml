name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install the extension dependencies
        working-directory: extension
        run: npm ci

      - name: Rascal tests
        run: ./test.sh
        env:
          RASCAL_JAR: extension/node_modules/@usethesource/rascal-vscode-dsl-lsp-server/assets/jars/rascal.jar

      - name: Build the extension
        working-directory: extension
        run: npm run vsix

      - name: Test the extension in VS Code
        working-directory: extension
        run: xvfb-run -a npm test
        env:
          VSCODE_VERSION: '1.95.0'

      - uses: actions/upload-artifact@v4
        with:
          name: automata-vsix
          path: extension/*.vsix

      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: extension/*.vsix
