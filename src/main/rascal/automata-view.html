<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="/lib/cytoscape.js"></script>
<script src="/lib/cytoscape-dagre.js"></script>
<style>
  [hidden] { display: none !important; }
  body { margin: 0; font: 14px sans-serif; color: #000; background: #fff; display: flex; flex-direction: column; height: 100vh; }
  header, .row, #say { padding: 8px 12px; }
  header { display: flex; gap: 6px; align-items: center; }
  header b { margin-right: 8px; }
  input { font: 14px monospace; width: 200px; }
  #result { margin-left: 8px; }
  .row { display: flex; gap: 2px; align-items: center; min-height: 26px; padding-top: 0; }
  .row small { width: 44px; color: #666; }
  .cells { display: flex; gap: 2px; }
  .cell { font: 15px monospace; min-width: 24px; height: 24px; line-height: 24px; text-align: center; border: 1px solid #aaa; }
  .read { color: #aaa; }
  .here { border: 2px solid #000; }
  #say { font: 13px monospace; color: #333; white-space: pre-line; max-height: 30vh; overflow: auto; border-bottom: 1px solid #ddd; }
  #graph { flex: 1; min-height: 0; }
</style>
</head>
<body>
<header>
  <b id="name"></b>
  <input id="word" placeholder="word" autocomplete="off" spellcheck="false">
  <button id="run">Run</button>
  <button id="back">◀</button>
  <button id="next">▶</button>
  <span id="result"></span>
</header>
<div class="row"><small>tape</small><span id="tape" class="cells"></span></div>
<div class="row" id="stackRow" hidden><small>stack</small><span id="stack" class="cells"></span></div>
<div id="say"></div>
<div id="graph"></div>
<script>
const $ = id => document.getElementById(id);
let cy;
let run = { word: "", steps: [], verdict: "", at: 0 };

const style = [
  { selector: "node", style: {
      label: "data(label)", "text-wrap": "wrap", "text-valign": "center", "text-halign": "center",
      "background-color": "#fff", "border-width": 1.5, "border-color": "#000", shape: "ellipse",
      width: "label", height: "label", padding: "12px", "font-family": "monospace", "font-size": "13px" } },
  { selector: "node.final", style: { "border-style": "double", "border-width": 6 } },
  { selector: "node.entry", style: { width: 1, height: 1, padding: 0, "border-width": 0, "background-opacity": 0, label: "" } },
  { selector: "node.term", style: { shape: "round-rectangle" } },
  { selector: "node.on", style: { "background-color": "#ffe9a8" } },
  { selector: "edge", style: {
      label: "data(label)", "text-wrap": "wrap", "curve-style": "bezier", "target-arrow-shape": "triangle", width: 1,
      "line-color": "#444", "target-arrow-color": "#444", "font-family": "monospace", "font-size": "12px",
      "text-background-color": "#fff", "text-background-opacity": 1, "loop-direction": "0deg", "loop-sweep": "-60deg" } },
  { selector: "edge.took", style: { width: 3 } },
  { selector: "edge.jump", style: { width: 2, "line-style": "dashed" } }
];

function draw(a) {
  const elements = [];
  for (const n of a.nodes) {
    const label = n.label || (n.note ? n.id + "\n" + n.note : n.id);
    elements.push({ data: { id: n.id, label }, classes: (n.final ? "final " : "") + (n.terminal ? "term" : "") });
    if (n.initial) {
      elements.push({ data: { id: ">" + n.id }, classes: "entry" });
      elements.push({ data: { source: ">" + n.id, target: n.id, label: "" } });
    }
  }
  for (const e of a.edges) elements.push({ data: e });
  if (cy) cy.destroy();
  const layout = a.direction == "TB"
    ? { name: "preset", positions: tree(a), padding: 30 }
    : { name: "dagre", rankDir: "LR", nodeSep: 60, rankSep: 120, padding: 30 };
  cy = cytoscape({ container: $("graph"), elements, style, maxZoom: 1.5, layout });
}

function tree(a) {
  const kids = {};
  for (const e of a.edges) (kids[e.source] = kids[e.source] || []).push(e.target);
  const at = {};
  let leaves = 0;
  const place = (id, depth) => {
    const below = (kids[id] || []).map(k => place(k, depth + 1));
    const x = below.length ? (below[0] + below[below.length - 1]) / 2 : 60 * leaves++;
    at[id] = { x, y: 70 * depth };
    return x;
  };
  if (a.nodes.length) place(a.nodes[0].id, 0);
  return at;
}

function cell(text, cls) {
  const span = document.createElement("span");
  span.textContent = text;
  span.className = cls;
  return span;
}

function show() {
  const s = run.steps[run.at];
  cy.elements().removeClass("on took jump");
  for (const q of s.states) cy.getElementById(q).addClass("on");
  for (const e of s.moves) cy.getElementById(e).addClass("took");
  for (const e of s.jumps) cy.getElementById(e).addClass("jump");
  if (s.shown) {
    const shown = new Set(s.shown);
    cy.nodes().forEach(n => n.style("display", shown.has(n.id()) ? "element" : "none"));
  }
  const tape = s.tape.length == 0 && s.read ? ["λ"] : s.tape;
  $("tape").replaceChildren(...tape.map((c, i) =>
    cell(c, "cell" + (s.read && i < s.head ? " read" : "") + (i == s.head || (s.read && s.tape.length == 0) ? " here" : ""))));
  $("stackRow").hidden = !s.stack;
  if (s.stack) $("stack").replaceChildren(...(s.stack.length ? s.stack : ["empty"]).map(c => cell(c, "cell")));
  $("say").textContent = "step " + run.at + " of " + (run.steps.length - 1) + "\n" + s.notes.join("\n");
  $("result").textContent = run.at == run.steps.length - 1 ? run.verdict : "";
}

async function start(toEnd) {
  const word = $("word").value.trim();
  const r = await (await fetch("/run?word=" + encodeURIComponent(word))).json();
  if (r.error) {
    $("result").textContent = r.error;
    return;
  }
  if (r.graph) draw(r.graph);
  run = { word, steps: r.steps, verdict: r.verdict, at: toEnd ? r.steps.length - 1 : 0 };
  show();
}

function move(d) {
  if (run.steps.length == 0 || run.word != $("word").value.trim()) return start(false);
  run.at = Math.min(Math.max(run.at + d, 0), run.steps.length - 1);
  show();
}

$("run").onclick = () => start(true);
$("back").onclick = () => move(-1);
$("next").onclick = () => move(1);
$("word").onkeydown = e => { if (e.key == "Enter") start(true); };

fetch("/automaton").then(r => r.json()).then(a => {
  $("name").textContent = a.name;
  $("word").value = a.word;
  draw(a);
  start(false);
});
</script>
</body>
</html>
